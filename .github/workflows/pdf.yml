name: Pdf render test
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Start Jandapress container
        run: |
          docker run -d -p 2002:3000 ghcr.io/sinkaroid/jandapress:latest
          # Wait for container to be ready
          sleep 10
      - name: Download book with pdf render
        run: cargo run -- --no_selfhost --jandapress_url http://localhost:2002 --nhentai 255369 --pdf
