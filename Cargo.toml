[package]
name = "tomoe"
version = "4.0.10"
edition = "2024"
authors = ["sinkaroid <scathachgrip@gmail.com>"]
description = "A robust doujinshi downloader, uncompromising in efficiency (Jandapress Orchestration)"
readme = "README.md"
homepage = "https://github.com/sinkaroid/tomoe"
repository = "https://github.com/sinkaroid/tomoe"
license = "MIT"
keywords = ["doujinshi", "downloader", "nhentai", "pdf", "cli"]
categories = ["command-line-utilities", "multimedia"]
exclude = [
    "*-*-*",
    "*.pdf",
    "tomoe.html",
    ".agent",
    "legacy",
    ".github",
    "resources",
    "AGENTS.md",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
printpdf = { version = "0.7", features = ["image"] }
image = "0.24"

[dev-dependencies]
tempfile = "3"
